<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ארמון מבצעית 931 - ניהול אמצעים</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    body { 
      background-color: #0b132b; 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #ffffff; 
      font-family: system-ui, -apple-system, sans-serif;
      transition: background-image 0.3s ease-in-out;
    }
    .card { background-color: rgba(28, 37, 65, 0.85); border: 1px solid #2a385b; backdrop-filter: blur(8px); }
  </style>
</head>
<body id="main-body" class="p-4 max-w-5xl mx-auto pb-12">

  <!-- כותרת ראשית -->
  <header class="text-center mb-6 border-b border-gray-700 pb-4">
    <h1 class="text-3xl font-extrabold text-blue-400">ארמון מבצעית 931</h1>
    <p class="text-xs text-green-400 mt-1">● מחובר לענן (Firebase) - סנכרון בזמן אמת</p>
    
    <div id="admin-bg-panel" class="hidden mt-3">
      <button onclick="updateBackgroundUrl()" class="bg-amber-600 hover:bg-amber-500 text-xs font-bold text-white px-3 py-1.5 rounded-lg border border-amber-400">
        ⚙️ שינוי קישור תמונת רקע (מנהל)
      </button>
    </div>

    <div class="flex justify-center gap-4 mt-4">
      <button id="btn-dashboard" onclick="switchTab('dashboard')" class="bg-blue-600 px-5 py-2 rounded-lg font-bold text-sm">דו"ח מרוכז</button>
      <button id="btn-teams" onclick="switchTab('teams')" class="bg-gray-700 px-5 py-2 rounded-lg font-bold text-sm">ניהול צוותים</button>
    </div>
  </header>

  <!-- מסך 1: דו"ח מרוכז -->
  <div id="tab-dashboard">
    <div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-6">
      <div class="card p-3 rounded-xl text-center">
        <span class="text-gray-400 text-xs block mb-1">סוגי אמצעים במערכת</span>
        <span id="stat-types-count" class="text-2xl font-extrabold text-blue-300">0</span>
      </div>
      <div class="card p-3 rounded-xl text-center">
        <span class="text-gray-400 text-xs block mb-1">סה"כ פריטים מאופסנים</span>
        <span id="stat-total-stored" class="text-2xl font-extrabold text-green-400">0</span>
      </div>
      <div class="card p-3 rounded-xl text-center col-span-2 md:col-span-1">
        <span class="text-gray-400 text-xs block mb-1">סה"כ פריטים בחוץ</span>
        <span id="stat-total-outside" class="text-2xl font-extrabold text-amber-400">0</span>
      </div>
    </div>

    <div class="card p-4 rounded-xl">
      <h2 class="text-sm font-bold mb-3 text-center border-b border-gray-700 pb-2">טבלה מתכללת: אמצעים מאופסנים לפי צוותים</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-center text-xs">
          <thead>
            <tr id="matrix-header" class="border-b border-gray-600 text-gray-400">
              <th class="p-2 text-right">סוג אמצעי</th>
            </tr>
          </thead>
          <tbody id="matrix-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- מסך 2: רשימת צוותים -->
  <div id="tab-teams" class="hidden">
    <div class="card p-3 rounded-xl mb-4 flex gap-2">
      <input type="text" id="new-team-name" placeholder="שם צוות חדש (למשל: רתק, חוד, חפ''ק)..." class="bg-gray-800 border border-gray-700 rounded-lg p-2 text-sm flex-1 text-white">
      <button onclick="addTeam()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg text-sm font-bold">הוסף צוות</button>
    </div>

    <div id="teams-list" class="space-y-3"></div>
  </div>

  <!-- מסך 3: ניהול צוות ספציפי -->
  <div id="tab-single-team" class="hidden">
    <button onclick="switchTab('teams')" class="text-xs text-blue-400 mb-3 block">← חזרה לכל הצוותים</button>
    <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
      <h2 id="current-team-title" class="text-xl font-bold"></h2>
    </div>

    <!-- טופס הוספת אמצעי -->
    <div class="card p-3 rounded-xl mb-4 space-y-2">
      <span class="text-xs font-bold text-gray-300 block mb-1">הוספת אמצעי חדש לצוות:</span>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
        <input type="text" id="item-type" oninput="checkWeaponType()" placeholder="סוג אמצעי (נגב, M4, ציין...)" class="bg-gray-800 border border-gray-700 rounded-lg p-2 text-xs text-white">
        <input type="text" id="item-id" placeholder="זיהוי ייחודי / צ' נשק" class="bg-gray-800 border border-gray-700 rounded-lg p-2 text-xs text-white">
        <input type="number" id="item-qty" placeholder="כמות" value="1" min="1" class="bg-gray-800 border border-gray-700 rounded-lg p-2 text-xs text-white">
        <input type="text" id="item-owner" placeholder="למי שייך (שם חייל)" class="bg-gray-800 border border-gray-700 rounded-lg p-2 text-xs text-white">
      </div>

      <!-- שדות נשק מורחבים (כוונת + פ"ק - נפתחים רק עבור נגב / M4) -->
      <div id="weapon-fields" class="hidden space-y-2 pt-2 border-t border-gray-700">
        <!-- כוונת -->
        <div class="grid grid-cols-2 gap-2">
          <select id="sight-type" class="bg-gray-800 border border-gray-700 rounded-lg p-2 text-xs text-white">
            <option value="">בחר סוג כוונת...</option>
            <option value="EOTECH">EOTECH</option>
            <option value="Trijicon">Trijicon</option>
            <option value="M5">M5</option>
            <option value="אחר">אחר</option>
          </select>
          <input type="text" id="sight-id" placeholder="צ' כוונת" class="bg-gray-800 border border-gray-700 rounded-lg p-2 text-xs text-white">
        </div>

        <!-- פ"ק -->
        <div class="grid grid-cols-2 gap-2">
          <select id="peq-type" class="bg-gray-800 border border-gray-700 rounded-lg p-2 text-xs text-white">
            <option value="">בחר סוג פ"ק...</option>
            <option value="EOTECH OGL">EOTECH OGL</option>
            <option value="אחר">אחר</option>
          </select>
          <input type="text" id="peq-id" placeholder="צ' פ''ק" class="bg-gray-800 border border-gray-700 rounded-lg p-2 text-xs text-white">
        </div>
      </div>

      <button onclick="addItem()" class="w-full bg-green-600 hover:bg-green-500 py-2 rounded-lg text-xs font-bold mt-2">+ הוסף אמצעי</button>
    </div>

    <div id="items-list" class="space-y-3"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA2Fa08VxXozP-fAYOBJhkzWA-qOL6VYBU",
      authDomain: "grande-815a1.firebaseapp.com",
      databaseURL: "https://grande-815a1-default-rtdb.firebaseio.com",
      projectId: "grande-815a1",
      storageBucket: "grande-815a1.firebasestorage.app",
      messagingSenderId: "921189338159",
      appId: "1:921189338159:web:1fa991d9e776bc7d228ada",
      measurementId: "G-NSMKKY2EER"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentTeamId = null;

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('admin') === 'true') {
        document.getElementById('admin-bg-panel').classList.remove('hidden');
      }
    });

    db.ref('settings/armon_bg').on('value', (snapshot) => {
      const bgUrl = snapshot.val();
      if (bgUrl) {
        document.body.style.backgroundImage = `linear-gradient(rgba(11, 19, 43, 0.85), rgba(11, 19, 43, 0.85)), url('${bgUrl}')`;
      }
    });

    function updateBackgroundUrl() {
      const newUrl = prompt("הכנס קישור לתמונת הרקע:");
      if (newUrl) db.ref('settings/armon_bg').set(newUrl.trim());
    }

    function checkWeaponType() {
      const typeVal = document.getElementById('item-type').value.trim().toLowerCase();
      const weaponFields = document.getElementById('weapon-fields');
      if (typeVal.includes('נגב') || typeVal.includes('m4') || typeVal.includes('אמ4') || typeVal.includes('אמ 4')) {
        weaponFields.classList.remove('hidden');
      } else {
        weaponFields.classList.add('hidden');
      }
    }

    function switchTab(tabName) {
      document.getElementById('tab-dashboard').classList.add('hidden');
      document.getElementById('tab-teams').classList.add('hidden');
      document.getElementById('tab-single-team').classList.add('hidden');
      
      document.getElementById(`tab-${tabName}`).classList.remove('hidden');

      document.getElementById('btn-dashboard').className = tabName === 'dashboard' ? 'bg-blue-600 px-5 py-2 rounded-lg font-bold text-sm' : 'bg-gray-700 px-5 py-2 rounded-lg font-bold text-sm';
      document.getElementById('btn-teams').className = tabName !== 'dashboard' ? 'bg-blue-600 px-5 py-2 rounded-lg font-bold text-sm' : 'bg-gray-700 px-5 py-2 rounded-lg font-bold text-sm';
    }

    db.ref('armon_inventory').on('value', (snapshot) => {
      const data = snapshot.val() || {};
      renderDashboard(data);
      renderTeams(data);
      if (currentTeamId) renderSingleTeam(data, currentTeamId);
    });

    function addTeam() {
      const input = document.getElementById('new-team-name');
      const name = input.value.trim();
      if (!name) return;
      const teamId = db.ref('armon_inventory').push().key;
      db.ref(`armon_inventory/${teamId}`).set({ name: name, items: {} });
      input.value = '';
    }

    function deleteTeam(teamId, teamName) {
      if (confirm(`האם למחוק את צוות "${teamName}" ואת כל האמצעים שלו?`)) {
        db.ref(`armon_inventory/${teamId}`).remove();
      }
    }

    function addItem() {
      const type = document.getElementById('item-type').value.trim();
      const uniqueId = document.getElementById('item-id').value.trim();
      const qty = parseInt(document.getElementById('item-qty').value) || 1;
      const owner = document.getElementById('item-owner').value.trim();
      const sightType = document.getElementById('sight-type').value;
      const sightId = document.getElementById('sight-id').value.trim();
      const peqType = document.getElementById('peq-type').value;
      const peqId = document.getElementById('peq-id').value.trim();

      if (!type || !currentTeamId) {
        alert("חובה להזין סוג אמצעי");
        return;
      }

      const itemId = db.ref(`armon_inventory/${currentTeamId}/items`).push().key;
      db.ref(`armon_inventory/${currentTeamId}/items/${itemId}`).set({
        type: type,
        uniqueId: uniqueId,
        quantity: qty,
        owner: owner,
        sightType: sightType || '',
        sightId: sightId || '',
        peqType: peqType || '',
        peqId: peqId || '',
        isStored: false
      });

      document.getElementById('item-type').value = '';
      document.getElementById('item-id').value = '';
      document.getElementById('item-qty').value = '1';
      document.getElementById('item-owner').value = '';
      document.getElementById('sight-type').value = '';
      document.getElementById('sight-id').value = '';
      document.getElementById('peq-type').value = '';
      document.getElementById('peq-id').value = '';
      document.getElementById('weapon-fields').classList.add('hidden');
    }

    function updateItemStatus(itemId, isStored) {
      db.ref(`armon_inventory/${currentTeamId}/items/${itemId}/isStored`).set(isStored);
    }

    function deleteItem(itemId) {
      if (confirm("האם למחוק אמצעי זה?")) {
        db.ref(`armon_inventory/${currentTeamId}/items/${itemId}`).remove();
      }
    }

    function renderTeams(data) {
      const list = document.getElementById('teams-list');
      list.innerHTML = '';
      Object.keys(data).forEach(teamId => {
        const team = data[teamId];
        const items = team.items ? Object.values(team.items) : [];
        let storedCount = 0;
        items.forEach(i => { if (i.isStored) storedCount += (i.quantity || 1); });

        list.innerHTML += `
          <div class="card p-4 rounded-xl flex justify-between items-center">
            <div>
              <h3 class="font-bold text-lg">${team.name}</h3>
              <p class="text-xs text-gray-400">${items.length} סוגי אמצעים רשומים · ${storedCount} פריטים מאופסנים</p>
            </div>
            <div class="flex gap-2">
              <button onclick="openTeam('${teamId}')" class="bg-blue-600 hover:bg-blue-500 px-3 py-2 rounded-lg text-xs font-bold">ניהול אמצעים</button>
              <button onclick="deleteTeam('${teamId}', '${team.name}')" class="bg-red-900/60 hover:bg-red-800 text-red-300 border border-red-700 px-3 py-2 rounded-lg text-xs font-bold">מחק צוות</button>
            </div>
          </div>
        `;
      });
    }

    function openTeam(teamId) {
      currentTeamId = teamId;
      switchTab('single-team');
      db.ref('armon_inventory').once('value', snapshot => renderSingleTeam(snapshot.val() || {}, teamId));
    }

    function renderSingleTeam(data, teamId) {
      const team = data[teamId];
      if (!team) return;
      document.getElementById('current-team-title').innerText = `אמצעים - צוות ${team.name}`;

      const list = document.getElementById('items-list');
      list.innerHTML = '';

      const items = team.items || {};
      Object.keys(items).forEach(iId => {
        const item = items[iId];
        list.innerHTML += `
          <div class="card p-3 rounded-xl flex justify-between items-center text-xs">
            <div class="space-y-1">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="font-bold text-sm text-blue-300">${item.type}</span>
                ${item.uniqueId ? `<span class="bg-gray-800 px-2 py-0.5 rounded text-gray-300 border border-gray-700">צ': ${item.uniqueId}</span>` : ''}
                ${item.sightType ? `<span class="bg-amber-900/50 text-amber-300 px-2 py-0.5 rounded border border-amber-700 font-bold">כוונת: ${item.sightType} ${item.sightId ? `(צ' ${item.sightId})` : ''}</span>` : ''}
                ${item.peqType ? `<span class="bg-purple-900/50 text-purple-300 px-2 py-0.5 rounded border border-purple-700 font-bold">פ''ק: ${item.peqType} ${item.peqId ? `(צ' ${item.peqId})` : ''}</span>` : ''}
              </div>
              <p class="text-gray-400">כמות: <b class="text-white">${item.quantity || 1}</b> | שייך ל: <b class="text-white">${item.owner || 'לא שויך'}</b></p>
            </div>
            <div class="flex items-center gap-3">
              <label class="flex items-center gap-1.5 cursor-pointer bg-gray-800 px-2.5 py-1.5 rounded-lg border border-gray-700">
                <input type="checkbox" ${item.isStored ? 'checked' : ''} onchange="updateItemStatus('${iId}', this.checked)" class="w-4 h-4 text-blue-600 rounded">
                <span class="${item.isStored ? 'text-green-400 font-bold' : 'text-gray-400'}">מאופסן</span>
              </label>
              <button onclick="deleteItem('${iId}')" class="text-red-400 hover:text-red-300">מחק</button>
            </div>
          </div>
        `;
      });
    }

    function renderDashboard(data) {
      let totalStored = 0;
      let totalOutside = 0;
      let typeMap = {}; 
      let teamNames = [];

      Object.values(data).forEach(team => {
        if (!teamNames.includes(team.name)) teamNames.push(team.name);
        if (!team.items) return;

        Object.values(team.items).forEach(item => {
          const qty = item.quantity || 1;
          const type = item.type;

          if (!typeMap[type]) typeMap[type] = { totalStored: 0, teams: {} };

          if (item.isStored) {
            totalStored += qty;
            typeMap[type].totalStored += qty;
            typeMap[type].teams[team.name] = (typeMap[type].teams[team.name] || 0) + qty;
          } else {
            totalOutside += qty;
          }
        });
      });

      document.getElementById('stat-types-count').innerText = Object.keys(typeMap).length;
      document.getElementById('stat-total-stored').innerText = totalStored;
      document.getElementById('stat-total-outside').innerText = totalOutside;

      const header = document.getElementById('matrix-header');
      header.innerHTML = '<th class="p-2 text-right">סוג אמצעי</th>';
      teamNames.forEach(name => {
        header.innerHTML += `<th class="p-2">${name}</th>`;
      });
      header.innerHTML += '<th class="p-2 text-green-400">סה"כ באפסון</th>';

      const tbody = document.getElementById('matrix-body');
      tbody.innerHTML = '';
      Object.keys(typeMap).forEach(type => {
        let rowHTML = `<tr class="border-b border-gray-700"><td class="p-2 font-bold text-right">${type}</td>`;
        teamNames.forEach(name => {
          const count = typeMap[type].teams[name] || '-';
          rowHTML += `<td class="p-2 ${count !== '-' ? 'text-blue-300 font-bold' : 'text-gray-500'}">${count}</td>`;
        });
        rowHTML += `<td class="p-2 text-green-400 font-bold">${typeMap[type].totalStored}</td></tr>`;
        tbody.innerHTML += rowHTML;
      });
    }
  </script>
</body>
</html>
